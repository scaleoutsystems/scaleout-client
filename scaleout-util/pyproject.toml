[project]
name = "scaleoututil"
version = "1.1.0"
description = "A library for shared resources in the Scaleout Edge"
authors = [{ name = "Scaleout Systems AB" }]
requires-python = ">=3.11, <3.14"
readme = "scaleoututil/README.rst"
license = "Apache-2.0"
dependencies = [
    "grpcio==1.83.1",
    "protobuf>=6.33.5,<7",
    "numpy>=2.5.3,<2.6", # 2.5 requires python 3.12
    "requests>=2.31",
    "urllib3>=2.6.0",
    "pyjwt>=2.12.0",
    "virtualenv==21.7.8",
    "filelock>=3.13",
    "cryptography>=50.0.0",
    "PyYAML~=6.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "scaleoututil"]
addopts = "--doctest-modules --cov=scaleoututil --cov-report=term-missing --cov-report=xml --cov-report=html"

[project.urls]
Homepage = "https://scaleoutsystems.com"
Documentation = "https://docs.scaleoutsystems.com/en/latest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
