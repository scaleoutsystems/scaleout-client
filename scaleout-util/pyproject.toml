[project]
name = "scaleoututil"
version = "1.2.0"
description = "A library for shared resources in the Scaleout Edge"
authors = [{ name = "Scaleout Systems AB" }]
requires-python = ">=3.11, <3.14"
readme = "scaleoututil/README.rst"
license = "Apache-2.0"
dependencies = [
    "grpcio==1.85.0",
    "protobuf>=6.33.5,<7",
    # numpy 2.5 requires Python 3.12, so Python 3.11 gets the 2.2 to 2.4 releases.
    "numpy>=2.5.3,<2.6; python_version >= '3.12'",
    "numpy>=2.2.6,<2.5; python_version < '3.12'",
    "requests>=2.31",
    "urllib3>=2.6.0",
    "pyjwt>=2.15.1",
    "virtualenv==21.15.1",
    "filelock>=4.0.5",
    "cryptography>=50.0.0",
    "PyYAML~=6.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "scaleoututil"]
addopts = "--doctest-modules --cov=scaleoututil --cov-report=term-missing --cov-report=xml --cov-report=html"

[project.urls]
Homepage = "https://scaleoutsystems.com"
Documentation = "https://docs.scaleoutsystems.com/en/latest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
